<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="titaniumBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#475569" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="titaniumInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="emeraldGlass" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="85%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="30%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <linearGradient id="chromeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="chassisShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#10b981" flood-opacity="0.6" />
    </filter>
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#022c22" flood-opacity="0.9" />
    </filter>
    <filter id="ledGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="#05070c" rx="128" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#titaniumBevel)" filter="url(#chassisShadow)" />
  <rect x="44" y="44" width="424" height="424" rx="92" fill="url(#titaniumInner)" />

  <circle cx="85" cy="85" r="7" fill="#64748b" stroke="#1e293b" stroke-width="2" />
  <circle cx="427" cy="85" r="7" fill="#64748b" stroke="#1e293b" stroke-width="2" />
  <circle cx="85" cy="427" r="7" fill="#64748b" stroke="#1e293b" stroke-width="2" />
  <circle cx="427" cy="427" r="7" fill="#64748b" stroke="#1e293b" stroke-width="2" />
  <circle cx="427" cy="85" r="9" fill="#10b981" filter="url(#ledGlow)" opacity="0.9" />

  <rect x="76" y="76" width="360" height="360" rx="72" fill="#090d16" stroke="#1e293b" stroke-width="3" />
  <rect x="86" y="86" width="340" height="340" rx="62" fill="url(#emeraldGlass)" filter="url(#emeraldGlow)" />
  <rect x="86" y="86" width="340" height="170" rx="62" fill="url(#glassReflection)" />

  <g transform="translate(256, 240) scale(1.05)" filter="url(#symbolShadow)">
    <path d="M -30 -95 L 35 -95 C 60 -95 80 -75 90 -55 L 105 -15 L 85 -5 L 70 -45 C 65 -58 52 -70 35 -70 L -30 -70 L -30 -48 L -80 -82.5 L -30 -117 Z" fill="url(#chromeLight)" stroke="#ffffff" stroke-width="2" />
    <g transform="rotate(120)">
      <path d="M -30 -95 L 35 -95 C 60 -95 80 -75 90 -55 L 105 -15 L 85 -5 L 70 -45 C 65 -58 52 -70 35 -70 L -30 -70 L -30 -48 L -80 -82.5 L -30 -117 Z" fill="url(#chromeLight)" stroke="#ffffff" stroke-width="2" />
    </g>
    <g transform="rotate(240)">
      <path d="M -30 -95 L 35 -95 C 60 -95 80 -75 90 -55 L 105 -15 L 85 -5 L 70 -45 C 65 -58 52 -70 35 -70 L -30 -70 L -30 -48 L -80 -82.5 L -30 -117 Z" fill="url(#chromeLight)" stroke="#ffffff" stroke-width="2" />
    </g>
  </g>

  <rect x="176" y="380" width="160" height="28" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  <circle cx="204" cy="394" r="5" fill="#34d399" filter="url(#ledGlow)" />
  <circle cx="230" cy="394" r="5" fill="#10b981" filter="url(#ledGlow)" />
  <circle cx="256" cy="394" r="5" fill="#10b981" filter="url(#ledGlow)" />
  <circle cx="282" cy="394" r="5" fill="#10b981" filter="url(#ledGlow)" />
  <circle cx="308" cy="394" r="5" fill="#059669" filter="url(#ledGlow)" />
</svg>
